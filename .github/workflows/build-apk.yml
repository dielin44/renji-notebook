name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run logic tests
        run: npm test

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 10 WebView smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.renji.notebook/files/qa qa-artifacts

      - name: Print Android test failure details
        if: failure()
        run: |
          grep -R -n -C 6 -E "RenjiTest|AndroidRuntime|FATAL|Assertion|Condition timed|failure|FAILED|Exception" \
            app/build/reports/androidTests/connected \
            app/build/outputs/androidTest-results/connected || true
          tail -n 220 app/build/outputs/androidTest-results/connected/debug/*/logcat-*directButtons*.txt || true

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-webview-test-report-v1.1.0
          path: |
            app/build/reports/androidTests/connected
            qa-artifacts
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: renji-notebook-v1.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish directly installable APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk renji-notebook-v1.1.0.apk
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 renji-notebook-v1.1.0.apk --clobber
          else
            gh release create v1.1.0 renji-notebook-v1.1.0.apk --target "$GITHUB_SHA" --title "人際小本本 v1.1.0" --notes-file RELEASE_NOTES.md
          fi
