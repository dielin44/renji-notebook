name: Build Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "package.json"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/build-play-aab.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 36 tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run logic tests
        run: npm test

      - name: Use existing Play Console application ID
        run: |
          sed -i "s/applicationId 'com.renji.notebook'/applicationId 'com.renjinotbook.myapp'/" app/build.gradle
          sed -i "s/compileSdk 35/compileSdk 36/" app/build.gradle
          sed -i "s/targetSdk 35/targetSdk 36/" app/build.gradle
          sed -i "s/versionCode 8/versionCode 9/" app/build.gradle

      - name: Build unsigned release bundle
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload unsigned bundle
        uses: actions/upload-artifact@v4
        with:
          name: renji-notebook-v1.2.0-play-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
