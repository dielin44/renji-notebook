<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0f12">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="人際評分、事件與借貸風險紀錄">
  <title>人際小本本</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite">
    <div class="boot-screen">
      <img src="icons/icon-192.png" alt="" width="88" height="88">
      <strong>人際小本本</strong>
      <span>載入中⋯</span>
    </div>
  </div>

  <dialog id="sheet" class="sheet" aria-modal="true">
    <div class="sheet-frame">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheet-content"></div>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-modal="true">
    <form method="dialog" class="confirm-card">
      <div class="confirm-icon">!</div>
      <h2 id="confirm-title">請確認</h2>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button value="cancel" class="button secondary">取消</button>
        <button value="confirm" id="confirm-accept" class="button danger">確認</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="logic.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
